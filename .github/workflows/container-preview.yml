name: Container Preview

on:
  push:
    branches-ignore:
      - master
      - main
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch,prefix=branch-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Dozor deterministic state evaluation engine

      - name: Build container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dozor/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: always()
        run: |
          status_emoji() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⚪";;
              skipped) echo "⏭️";;
              *) echo "❔";;
            esac
          }

          {
            echo "## Container Preview Summary"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Build & push: $(status_emoji "${{ steps.build.outcome }}") \`${{ steps.build.outcome }}\`"
            echo ""
            echo "### Published tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
