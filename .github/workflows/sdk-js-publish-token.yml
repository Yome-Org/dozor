name: SDK JS Publish (Token Fallback)

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected SDK version from package.json (e.g. 0.1.2)"
        required: true

permissions:
  contents: read

jobs:
  publish-token:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dozor-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/dozor-sdk/package-lock.json

      - name: Upgrade npm
        id: npm_upgrade
        run: |
          npm i -g npm@latest
          echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"

      - name: Validate package version
        id: validate_version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION="${{ github.event.inputs.expected_version }}"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: package.json=$PACKAGE_VERSION expected=$EXPECTED_VERSION" >&2
            exit 1
          fi
          echo "value=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        id: install
        run: npm ci

      - name: Lint and format check
        id: check
        run: npm run check

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        id: test_coverage
        run: npm run test:coverage

      - name: Build
        id: build
        run: npm run build

      - name: Publish to npm via token
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Job summary
        if: always()
        working-directory: .
        run: |
          status_emoji() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⚪";;
              skipped) echo "⏭️";;
              *) echo "❔";;
            esac
          }

          {
            echo "## SDK JS Publish (Token Fallback) Summary"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Expected version input: \`${{ github.event.inputs.expected_version }}\`"
            echo "- Resolved package version: \`${{ steps.validate_version.outputs.value }}\`"
            echo "- npm.version: \`${{ steps.npm_upgrade.outputs.version }}\`"
            echo "- Version validation: $(status_emoji "${{ steps.validate_version.outcome }}") \`${{ steps.validate_version.outcome }}\`"
            echo "- Install: $(status_emoji "${{ steps.install.outcome }}") \`${{ steps.install.outcome }}\`"
            echo "- Lint/Format: $(status_emoji "${{ steps.check.outcome }}") \`${{ steps.check.outcome }}\`"
            echo "- Typecheck: $(status_emoji "${{ steps.typecheck.outcome }}") \`${{ steps.typecheck.outcome }}\`"
            echo "- Tests + Coverage: $(status_emoji "${{ steps.test_coverage.outcome }}") \`${{ steps.test_coverage.outcome }}\`"
            echo "- Build: $(status_emoji "${{ steps.build.outcome }}") \`${{ steps.build.outcome }}\`"
            echo "- Publish: $(status_emoji "${{ steps.publish.outcome }}") \`${{ steps.publish.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
