name: SDK JS CI

on:
  pull_request:
    paths:
      - 'packages/dozor-sdk/**'
      - '.github/workflows/sdk-js-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/dozor-sdk/**'
      - '.github/workflows/sdk-js-ci.yml'
  workflow_dispatch:

jobs:
  sdk-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dozor-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/dozor-sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run check

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
