name: SDK JS Integration

on:
  workflow_dispatch:
    inputs:
      known_component:
        description: "Optional known Dozor component name for accepted-response test"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sdk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/dozor-sdk/package-lock.json

      - name: Prepare env
        id: prepare_env
        run: cp .env.example .env

      - name: Start Dozor stack
        id: start_stack
        run: docker compose --env-file .env -f docker/compose.yaml up --build -d

      - name: Wait for Dozor API port
        id: wait_port
        run: |
          for i in {1..90}; do
            if bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Dozor API port did not open in time"
          exit 1

      - name: Wait for Dozor /signal readiness
        id: wait_signal
        run: |
          for i in {1..90}; do
            status_code="$(
              curl -sS -o /tmp/dozor-ready.json -w "%{http_code}" \
                -H 'content-type: application/json' \
                -X POST http://localhost:8080/signal \
                -d '{"component":"sdk-ci-unknown-component","severity":"WARNING","source":"sdk-ci-readiness","occurredAt":"2026-01-01T00:00:00.000Z"}'
            )"

            if [ "$status_code" = "404" ] || [ "$status_code" = "400" ] || [ "$status_code" = "429" ] || [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
              exit 0
            fi

            sleep 2
          done
          echo "Dozor /signal did not become ready in time"
          cat /tmp/dozor-ready.json || true
          exit 1

      - name: Install SDK dependencies
        id: install
        working-directory: packages/dozor-sdk
        run: npm ci

      - name: Run SDK integration tests
        id: integration_tests
        working-directory: packages/dozor-sdk
        env:
          DOZOR_INTEGRATION_BASE_URL: http://localhost:8080
          DOZOR_INTEGRATION_COMPONENT: ${{ github.event.inputs.known_component }}
        run: npm run test:integration

      - name: Show service logs
        id: logs
        if: always()
        run: docker compose --env-file .env -f docker/compose.yaml logs dozor postgres redis mock-health

      - name: Stop stack
        id: stop_stack
        if: always()
        run: docker compose --env-file .env -f docker/compose.yaml down -v

      - name: Job summary
        if: always()
        run: |
          status_emoji() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⚪";;
              skipped) echo "⏭️";;
              *) echo "❔";;
            esac
          }

          known_component="${{ github.event.inputs.known_component }}"
          if [ -z "$known_component" ]; then
            known_component="(not provided)"
          fi

          {
            echo "## SDK JS Integration Summary"
            echo ""
            echo "- Trigger ref: \`${GITHUB_REF_NAME}\`"
            echo "- Base URL: \`http://localhost:8080\`"
            echo "- Known component input: \`${known_component}\`"
            echo "- Prepare env: $(status_emoji "${{ steps.prepare_env.outcome }}") \`${{ steps.prepare_env.outcome }}\`"
            echo "- Start stack: $(status_emoji "${{ steps.start_stack.outcome }}") \`${{ steps.start_stack.outcome }}\`"
            echo "- Wait API port: $(status_emoji "${{ steps.wait_port.outcome }}") \`${{ steps.wait_port.outcome }}\`"
            echo "- Wait /signal readiness: $(status_emoji "${{ steps.wait_signal.outcome }}") \`${{ steps.wait_signal.outcome }}\`"
            echo "- Install SDK deps: $(status_emoji "${{ steps.install.outcome }}") \`${{ steps.install.outcome }}\`"
            echo "- Integration tests: $(status_emoji "${{ steps.integration_tests.outcome }}") \`${{ steps.integration_tests.outcome }}\`"
            echo "- Service logs: $(status_emoji "${{ steps.logs.outcome }}") \`${{ steps.logs.outcome }}\`"
            echo "- Stop stack: $(status_emoji "${{ steps.stop_stack.outcome }}") \`${{ steps.stop_stack.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
